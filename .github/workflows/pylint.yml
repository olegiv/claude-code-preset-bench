name: Pylint

on: [push]

permissions:
  contents: read

jobs:
  pylint:
    # bench.py is the only project code; usecases/ holds the agents' deliberately buggy task files.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.14"
      - name: Install pylint
        run: python -m pip install pylint==4.1.3
      - name: Lint bench.py
        run: pylint bench.py

  python-versions:
    # README promises Python 3.8+; pylint itself needs 3.10+, so 3.8 gets a compile and smoke run.
    # Python 3.8 builds exist only up to Ubuntu 24.04, hence no ubuntu-latest.
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ["3.8", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile and list configs
        run: |
          python -m py_compile bench.py
          python bench.py list
